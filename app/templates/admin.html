<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Креативы — Панель ревьюера</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #242836;
      --border: #2e3345;
      --text: #e8eaed;
      --muted: #8b92a5;
      --accent: #5b8def;
      --accent-hover: #4a7de0;
      --success: #34c759;
      --warning: #ff9f0a;
      --danger: #ff453a;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-card h1 { font-size: 1.5rem; margin-bottom: 8px; }
    .login-card p { color: var(--muted); margin-bottom: 24px; font-size: 0.9rem; }

    input, select, textarea, button {
      font-family: inherit;
      font-size: 0.95rem;
    }

    input[type="password"], textarea {
      width: 100%;
      padding: 12px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      outline: none;
    }

    input:focus, textarea:focus { border-color: var(--accent); }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      width: 100%;
      margin-top: 16px;
      padding: 12px;
    }

    .btn-primary:hover { background: var(--accent-hover); }

    .app { display: none; height: 100vh; }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .header h1 { font-size: 1.2rem; }
    .header .badge {
      background: var(--accent);
      color: white;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      margin-left: 8px;
    }

    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      height: calc(100vh - 57px);
    }

    .sidebar {
      border-right: 1px solid var(--border);
      overflow-y: auto;
      background: var(--surface);
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .submission-item {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
    }

    .submission-item:hover { background: var(--surface2); }
    .submission-item.active { background: var(--surface2); border-left: 3px solid var(--accent); }

    .submission-item .title { font-weight: 500; margin-bottom: 4px; }
    .submission-item .meta { font-size: 0.8rem; color: var(--muted); }

    .status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .status-new { background: #1e3a5f; color: #5b8def; }
    .status-in_review { background: #3d2e00; color: #ff9f0a; }
    .status-needs_fix { background: #3d1f00; color: #ff9f0a; }
    .status-approved { background: #0d3320; color: #34c759; }
    .status-rejected { background: #3d1515; color: #ff453a; }

    .main { display: flex; flex-direction: column; overflow: hidden; }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .tab {
      padding: 12px 24px;
      cursor: pointer;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .tab.active { color: var(--text); border-bottom-color: var(--accent); }
    .tab:hover { color: var(--text); }

    .tab-content { flex: 1; overflow-y: auto; padding: 24px; display: none; }
    .tab-content.active { display: block; }

    .detail-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 16px;
    }

    .detail-card h2 { font-size: 1.1rem; margin-bottom: 16px; }

    .detail-row {
      display: flex;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    .detail-row:last-child { border-bottom: none; }
    .detail-label { width: 140px; color: var(--muted); flex-shrink: 0; }
    .detail-value a { color: var(--accent); text-decoration: none; }
    .detail-value a:hover { text-decoration: underline; }

    .status-select {
      padding: 8px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
    }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 57px - 45px);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .message-buyer {
      align-self: flex-start;
      background: var(--surface2);
      border: 1px solid var(--border);
    }

    .message-admin {
      align-self: flex-end;
      background: var(--accent);
      color: white;
    }

    .message .sender {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-bottom: 4px;
    }

    .message .time {
      font-size: 0.7rem;
      opacity: 0.5;
      margin-top: 4px;
    }

    .chat-input {
      display: flex;
      gap: 8px;
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .chat-input textarea {
      flex: 1;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      padding: 10px 14px;
    }

    .chat-input .btn {
      background: var(--accent);
      color: white;
      align-self: flex-end;
    }

    .error { color: var(--danger); font-size: 0.85rem; margin-top: 8px; }

    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { max-height: 200px; }
    }
  </style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <h1>Креативы Танков</h1>
    <p>Панель ревьюера</p>
    <input type="password" id="passwordInput" placeholder="Пароль" autofocus>
    <button class="btn btn-primary" onclick="login()">Войти</button>
    <div id="loginError" class="error"></div>
  </div>
</div>

<div id="app" class="app">
  <div class="header">
    <div>
      <h1>Креативы Танков <span class="badge" id="newCount">0</span></h1>
    </div>
    <div style="color: var(--muted); font-size: 0.85rem;">Панель ревьюера</div>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-header">Заявки от бюеров</div>
      <div id="submissionList"></div>
    </div>

    <div class="main" id="mainPanel">
      <div class="empty-state" id="emptyState">Выберите заявку слева</div>

      <div id="detailPanel" style="display:none; height: 100%; flex-direction: column;">
        <div class="tabs">
          <div class="tab active" data-tab="info" onclick="switchTab('info')">Информация</div>
          <div class="tab" data-tab="chat" onclick="switchTab('chat')">Чат с бюером</div>
        </div>

        <div class="tab-content active" id="tab-info"></div>

        <div class="tab-content" id="tab-chat">
          <div class="chat-container">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
              <textarea id="chatInput" placeholder="Напишите бюеру..." rows="1"
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
              <button class="btn" onclick="sendMessage()">Отправить</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let currentSubmission = null;
let ws = null;
let submissions = [];

const STATUS_OPTIONS = [
  { value: 'new', label: 'Новая' },
  { value: 'in_review', label: 'На проверке' },
  { value: 'needs_fix', label: 'Нужны правки' },
  { value: 'approved', label: 'Одобрен' },
  { value: 'rejected', label: 'Отклонён' },
];

function getPassword() {
  return document.cookie.split(';').find(c => c.trim().startsWith('admin_auth='))?.split('=')[1] || '';
}

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      ...options.headers,
    },
  });
  if (res.status === 401) {
    showLogin();
    throw new Error('Unauthorized');
  }
  return res;
}

async function login() {
  const password = document.getElementById('passwordInput').value;
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password }),
  });
  if (!res.ok) {
    document.getElementById('loginError').textContent = 'Неверный пароль';
    return;
  }
  document.cookie = `admin_auth=${password}; path=/; max-age=86400`;
  showApp();
}

function showLogin() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadSubmissions();
  setInterval(loadSubmissions, 15000);
}

async function loadSubmissions() {
  try {
    const res = await api('/api/submissions');
    submissions = await res.json();
    renderSubmissionList();
    const newCount = submissions.filter(s => s.status === 'new').length;
    document.getElementById('newCount').textContent = newCount;
  } catch (e) { /* handled */ }
}

function renderSubmissionList() {
  const el = document.getElementById('submissionList');
  if (!submissions.length) {
    el.innerHTML = '<div class="empty-state" style="padding:40px">Нет заявок</div>';
    return;
  }
  el.innerHTML = submissions.map(s => `
    <div class="submission-item ${currentSubmission?.id === s.id ? 'active' : ''}"
         onclick="selectSubmission(${s.id})">
      <div class="title">#${s.id} — GFT ${esc(s.gft || '?')} / ${esc(s.domain || s.title)}</div>
      <div class="meta">
        ${esc(s.buyer.name)}${s.buyer.username ? ' @' + s.buyer.username : ''}
        · <span class="status status-${s.status}">${s.status_label}</span>
      </div>
    </div>
  `).join('');
}

async function selectSubmission(id) {
  currentSubmission = submissions.find(s => s.id === id);
  renderSubmissionList();

  document.getElementById('emptyState').style.display = 'none';
  const panel = document.getElementById('detailPanel');
  panel.style.display = 'flex';

  renderInfo();
  await loadMessages();
  connectWs(id);
}

function renderInfo() {
  const s = currentSubmission;
  if (!s) return;

  const statusOptions = STATUS_OPTIONS.map(o =>
    `<option value="${o.value}" ${o.value === s.status ? 'selected' : ''}>${o.label}</option>`
  ).join('');

  document.getElementById('tab-info').innerHTML = `
    <div class="detail-card">
      <h2>Заявка #${s.id}</h2>
      <div class="detail-row">
        <div class="detail-label">GFT</div>
        <div class="detail-value">${esc(s.gft || '—')}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Тип</div>
        <div class="detail-value">${esc(s.submission_type || '—')}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Домен</div>
        <div class="detail-value">${esc(s.domain || '—')}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Проблема</div>
        <div class="detail-value">${esc(s.problem || s.description || '—')}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Бюер</div>
        <div class="detail-value">${esc(s.buyer.username || s.buyer.name)} (id: ${s.buyer.telegram_id})</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Креатив</div>
        <div class="detail-value">${esc(s.file_name || '—')}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Google Doc</div>
        <div class="detail-value">
          ${s.google_doc_url
            ? `<a href="${s.google_doc_url}" target="_blank">Открыть документ →</a>`
            : '<span style="color:var(--muted)">Не создан (настройте Google API)</span>'}
        </div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Дата</div>
        <div class="detail-value">${formatDate(s.created_at)}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Статус</div>
        <div class="detail-value">
          <select class="status-select" onchange="updateStatus(this.value)">${statusOptions}</select>
        </div>
      </div>
    </div>
  `;
}

async function updateStatus(status) {
  await api(`/api/submissions/${currentSubmission.id}/status`, {
    method: 'PATCH',
    body: JSON.stringify({ status }),
  });
  currentSubmission.status = status;
  await loadSubmissions();
  currentSubmission = submissions.find(s => s.id === currentSubmission.id);
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.toggle('active', t.id === `tab-${tab}`));
}

async function loadMessages() {
  const res = await api(`/api/submissions/${currentSubmission.id}/messages`);
  const messages = await res.json();
  renderMessages(messages);
}

function renderMessages(messages) {
  const el = document.getElementById('chatMessages');
  el.innerHTML = messages.map(m => `
    <div class="message message-${m.sender}">
      <div class="sender">${m.sender === 'admin' ? 'Вы (ревьюер)' : esc(m.buyer_name || 'Бюер')}</div>
      <div>${esc(m.text)}</div>
      <div class="time">${formatDate(m.created_at)}</div>
    </div>
  `).join('');
  el.scrollTop = el.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || !currentSubmission) return;

  const res = await api(`/api/submissions/${currentSubmission.id}/messages`, {
    method: 'POST',
    body: JSON.stringify({ text }),
  });
  const msg = await res.json();
  input.value = '';

  const el = document.getElementById('chatMessages');
  el.innerHTML += `
    <div class="message message-admin">
      <div class="sender">Вы (ревьюер)</div>
      <div>${esc(msg.text)}</div>
      <div class="time">${formatDate(msg.created_at)}</div>
    </div>
  `;
  el.scrollTop = el.scrollHeight;
}

function connectWs(id) {
  if (ws) { ws.close(); ws = null; }
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/chat/${id}`);
  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'message' && data.sender === 'buyer') {
      loadMessages();
    }
  };
}

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function formatDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleString('ru-RU', {
    day: '2-digit', month: '2-digit', year: 'numeric',
    hour: '2-digit', minute: '2-digit',
  });
}

document.getElementById('passwordInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});

if (getPassword()) {
  showApp();
}
</script>
</body>
</html>
